version: 1
default: "Standard"

# Capsules that don't use one of a character's 7 capsule slots (the league's mod lets the game take
# them on top of the 7). The other rules still apply to them; the Match Builder and Calculator show
# them under "Free Slots".
freeSlots:
  - "DBZL_Cap_15"  # Flight
  - "00_0_0155"    # Broly's Ring
  - "DBZL_Cap_30"  # Supreme Kai's Potara
  - "DBZL_Cap_11"  # I Fight Alone!

rulesets:
  Standard:
    metadata:
      name: "Standard"
      description: "Per-character cost limit: 20"
      author: "team"
      createdAt: "2025-10-04"
    totalCost: 20
    scope: per-character
    mode: hard
    restrictions:
      - type: unique-per-character
        params:
          enabled: true
      - type: banned-ids
        params:
          ids:
            - "00_0_0151"
            - "00_0_0152"
            - "00_0_0111"
            - "00_0_0131"
            - "00_0_0123"
            - "DBZL_Cap_SoreLoser"  # Sore Loser (retired in the October 2026 capsule update)
      - type: max-same-per-team
        params:
          maxCount: 2
          overrides:
            "00_0_0099": 1    # Water's Blessing only allowed once per team
            "DBZL_Cap_1": 1   # Heart Virus only allowed once per team
            "DBZL_Cap_13": 1  # Halo only allowed once per team
            "DBZL_Cap_14": 1  # Halo: Corrupted only allowed once per team
            "DBZL_Cap_18": 1  # Absorption Model only allowed once per team
            "DBZL_Cap_21": 1  # Final Stand! only allowed once per team
            "DBZL_Cap_15": 5  # Flight: every character on the team may use it
      - type: max-cost-group-per-character
        params:
          maxCost: 6
          groupIds:
            - "00_0_0028"  # Blast Attack Boost 1
            - "00_0_0029"  # Blast Attack Boost 2
            - "00_0_0030"  # Blast Attack Boost 3
            - "00_0_0005"  # Rush Attack Boost 1
            - "00_0_0006"  # Rush Attack Boost 2
            - "00_0_0007"  # Rush Attack Boost 3
      - type: mutually-exclusive-team
        params:
          groups:
            - ids: ["00_0_0000"]  # Master Roshi Training
              maxCount: 2
            - ids: ["00_0_0150"]  # King Kai Training
              maxCount: 1
      - type: exclusive-group-per-character
        params:
          groups:
            - name: "Halo"
              maxCount: 1
              ids:
                - "DBZL_Cap_12"  # Ki Guarantee
                - "DBZL_Cap_13"  # Halo
                - "DBZL_Cap_14"  # Halo: Corrupted
            - name: "Form Lock"
              maxCount: 1
              ids:
                - "00_0_0155"    # Broly's Ring
                - "DBZL_Cap_30"  # Supreme Kai's Potara
                - "DBZL_Cap_11"  # I Fight Alone!

  Standard - Soft:
    metadata:
      name: "Standard - Soft"
      description: "Per-character cost limit: 20"
      author: "team"
      createdAt: "2025-10-04"
    totalCost: 20
    scope: per-character
    mode: soft
    restrictions:
      - type: unique-per-character
        params:
          enabled: true
      - type: banned-ids
        params:
          ids:
            - "00_0_0151"
            - "00_0_0152"
            - "00_0_0111"
            - "00_0_0131"
            - "00_0_0123"
            - "DBZL_Cap_SoreLoser"  # Sore Loser (retired in the October 2026 capsule update)
      - type: max-same-per-team
        params:
          maxCount: 2
          overrides:
            "00_0_0099": 1    # Water's Blessing only allowed once per team
            "DBZL_Cap_1": 1   # Heart Virus only allowed once per team
            "DBZL_Cap_13": 1  # Halo only allowed once per team
            "DBZL_Cap_14": 1  # Halo: Corrupted only allowed once per team
            "DBZL_Cap_18": 1  # Absorption Model only allowed once per team
            "DBZL_Cap_21": 1  # Final Stand! only allowed once per team
            "DBZL_Cap_15": 5  # Flight: every character on the team may use it
      - type: max-cost-group-per-character
        params:
          maxCost: 6
          groupIds:
            - "00_0_0028"  # Blast Attack Boost 1
            - "00_0_0029"  # Blast Attack Boost 2
            - "00_0_0030"  # Blast Attack Boost 3
            - "00_0_0005"  # Rush Attack Boost 1
            - "00_0_0006"  # Rush Attack Boost 2
            - "00_0_0007"  # Rush Attack Boost 3
      - type: mutually-exclusive-team
        params:
          groups:
            - ids: ["00_0_0000"]  # Master Roshi Training
              maxCount: 2
            - ids: ["00_0_0150"]  # King Kai Training
              maxCount: 1
      - type: exclusive-group-per-character
        params:
          groups:
