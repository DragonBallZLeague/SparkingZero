<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DBSZL Content Manager</title>
  <style>
    /* Custom styles for the CMS admin panel */
    [data-slate-editor] { min-height: 80px; }
  </style>
</head>
<body>
  <!-- Decap CMS (formerly Netlify CMS) — free, open-source, Git-based -->
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

  <script>
    // ================================================================
    // CUSTOM PREVIEW TEMPLATES
    // These make the CMS preview pane much more readable.
    // ================================================================

    const h = CMS.h;

    // ----------------------------------------------------------------
    // Playoff bracket helpers — used by the Playoffs section inside
    // SeasonPreview below. Ported 1:1 from utils/standings.js (seeding /
    // tiebreakers) and SeasonPage.jsx (seedOrder / deriveRounds), so the
    // seeds and matchups shown here should match the live site exactly.
    // ----------------------------------------------------------------

    function computeStandingsFromSchedule(schedule) {
      const record = {};
      (schedule || []).forEach(function (week) {
        (week.matches || []).forEach(function (m) {
          if (m.status !== 'completed' || !m.winner) return;
          [m.home, m.away].forEach(function (t) {
            if (!t) return;
            if (!record[t]) record[t] = { wins: 0, losses: 0 };
            if (m.winner === t) record[t].wins += 1;
            else record[t].losses += 1;
          });
        });
      });
      return record;
    }

    // Ported from computeH2HStandings() in utils/standings.js
    function computeH2HStandings(teamNames, schedule) {
      const nameSet = {};
      teamNames.forEach(function (t) { nameSet[t] = true; });
      const record = {};
      teamNames.forEach(function (t) { record[t] = { wins: 0, losses: 0 }; });
      (schedule || []).forEach(function (week) {
        (week.matches || []).forEach(function (m) {
          if (m.status !== 'completed' || !m.winner) return;
          if (!nameSet[m.home] || !nameSet[m.away]) return;
          if (m.winner === m.home) { record[m.home].wins += 1; record[m.away].losses += 1; }
          else if (m.winner === m.away) { record[m.away].wins += 1; record[m.home].losses += 1; }
        });
      });
      return record;
    }

    // Ported from applyTiebreakers() in utils/standings.js: sorts a group
    // of teams with identical W/L by 1) head-to-head among the group, 2)
    // avg_damage (higher wins, null loses), 3) alphabetical.
    function applyTiebreakers(tiedGroup, schedule) {
      if (tiedGroup.length <= 1) return tiedGroup;
      const names = tiedGroup.map(function (t) { return t.team; });
      const h2h = computeH2HStandings(names, schedule);
      const copy = tiedGroup.slice();
      copy.sort(function (a, b) {
        const ah = h2h[a.team];
        const bh = h2h[b.team];
        if (ah.wins !== bh.wins) return bh.wins - ah.wins;
        if (ah.losses !== bh.losses) return ah.losses - bh.losses;
        const ad = a.avg_damage != null ? a.avg_damage : null;
        const bd = b.avg_damage != null ? b.avg_damage : null;
        if (ad !== null && bd === null) return -1;
        if (ad === null && bd !== null) return 1;
        if (ad !== null && bd !== null && ad !== bd) return bd - ad;
        return String(a.team).localeCompare(String(b.team));
      });
      return copy;
    }

    // Ported from sortTeamsWithTiebreakers() in utils/standings.js
    function sortTeamsWithTiebreakers(teams, schedule) {
      const sorted = teams.slice().sort(function (a, b) { return (b.wins - a.wins) || (a.losses - b.losses); });
      const result = [];
      let i = 0;
      while (i < sorted.length) {
        let j = i + 1;
        while (j < sorted.length && sorted[j].wins === sorted[i].wins && sorted[j].losses === sorted[i].losses) j++;
        result.push.apply(result, applyTiebreakers(sorted.slice(i, j), schedule));
        i = j;
      }
      return result;
    }

    // Mirrors the sortByRecord() closure inside playoffSeeds in
    // SeasonPage.jsx: merge in win/loss record, then tiebreaker-sort.
    function sortByRecord(teamObjs, standings, schedule) {
      const withRec = teamObjs.map(function (t) {
        const rec = standings[t.team] || { wins: 0, losses: 0 };
        return Object.assign({}, t, rec);
      });
      return sortTeamsWithTiebreakers(withRec, schedule);
    }

    // Mirrors the playoffSeeds computation in SeasonPage.jsx (division
    // winners seeded 1..N by record, then wildcards seeded N+1..).
    function computeSeedings(kais, schedule) {
      const standings = computeStandingsFromSchedule(schedule);
      const divWinners = [];
      let wildcards = [];
      (kais || []).forEach(function (kai) {
        const sorted = sortByRecord(kai.teams || [], standings, schedule);
        if (!sorted.length) return;
        divWinners.push(sorted[0]);
        wildcards = wildcards.concat(sorted.slice(1));
      });
      const seededDivWinners = sortByRecord(divWinners, standings, schedule);
      const seededWildcards = sortByRecord(wildcards, standings, schedule);
      return seededDivWinners.concat(seededWildcards).map(function (t) { return t.team; });
    }

    // Mirrors seedOrder() in SeasonPage.jsx exactly.
    function seedOrder(size) {
      if (size <= 1) return [1];
      const prev = seedOrder(size / 2);
      const out = [];
      prev.forEach(function (s) { out.push(s); out.push(size + 1 - s); });
      return out;
    }

    // Mirrors deriveRounds() in SeasonPage.jsx. Wild Card and Quarterfinal
    // matches are now entered in the CMS in bracket top-to-bottom DISPLAY
    // order (matches[0] is the first match shown in that round, etc.) — the
    // old "raw seed-pair order" storage convention is gone, so entryNumber
    // now always equals the match's actual display position, no translation
    // needed. We still need to know which seeds meet at each display slot
    // (that pairing is fixed by the standard bracket seedOrder()), so that
    // part of the math stays — it's just applied by display row instead of
    // by raw storage index.
    function deriveRoundsForPreview(rawRounds, seedings) {
      if (!rawRounds || !rawRounds.length || !seedings || !seedings.length) return rawRounds || [];
      const n = seedings.length;
      const wcCount = ((rawRounds[0] && rawRounds[0].matches) || []).length;
      const byeCount = n - wcCount * 2;
      const postWcCount = byeCount + wcCount;

      if (byeCount < 0 || rawRounds.length < 2) return rawRounds; // mismatched data — bail safely

      const order = seedOrder(postWcCount);
      // seedSlotForWcDisp[dispRow] / seedSlotForQfDisp[dispRow] give the
      // "seed pairing index" (0-based) for the match at that display row —
      // i.e. which seeds face off at that position in the bracket.
      const seedSlotForWcDisp = order.filter(function (v) { return v > byeCount; }).map(function (v) { return v - byeCount - 1; });
      const seedSlotForQfDisp = order.filter(function (v) { return v <= byeCount; }).map(function (v) { return v - 1; });

      const wcMatches = seedSlotForWcDisp.map(function (seedSlot, dispRow) {
        const m = rawRounds[0].matches[dispRow] || {};
        let team_a = m.team_a || null;
        let team_b = m.team_b || null;
        let seed_a = m.seed_a != null ? m.seed_a : null;
        let seed_b = m.seed_b != null ? m.seed_b : null;
        const aIdx = byeCount + seedSlot;
        const bIdx = n - 1 - seedSlot;
        if (!team_a) { team_a = seedings[aIdx] || null; seed_a = aIdx + 1; }
        if (!team_b) { team_b = seedings[bIdx] || null; seed_b = bIdx + 1; }
        return Object.assign({}, m, { team_a: team_a, team_b: team_b, seed_a: seed_a, seed_b: seed_b, entryNumber: dispRow + 1 });
      });
      const wcWinners = wcMatches.map(function (m) { return m.winner || null; });

      const qfMatches = seedSlotForQfDisp.map(function (seedSlot, dispRow) {
        const m = (rawRounds[1] && rawRounds[1].matches[dispRow]) || {};
        let team_a = m.team_a || null;
        let team_b = m.team_b || null;
        let seed_a = m.seed_a != null ? m.seed_a : (seedSlot + 1);
        let seed_b = m.seed_b != null ? m.seed_b : null;
        if (!team_a) team_a = seedings[seedSlot] || null;
        if (!team_b) {
          team_b = wcWinners[dispRow] || null;
          if (team_b) seed_b = (seedings.indexOf(team_b) + 1) || null;
        }
        return Object.assign({}, m, { team_a: team_a, team_b: team_b, seed_a: seed_a, seed_b: seed_b, entryNumber: dispRow + 1 });
      });
      const qfWinners = qfMatches.map(function (m) { return m.winner || null; });

      const rounds = [
        Object.assign({}, rawRounds[0], { matches: wcMatches }),
        Object.assign({}, rawRounds[1], { matches: qfMatches }),
      ];

      let prevWinners = qfWinners;
      for (let ri = 2; ri < rawRounds.length; ri++) {
        const matches = ((rawRounds[ri] && rawRounds[ri].matches) || []).map(function (m, mi) {
          let team_a = m.team_a || null;
          let team_b = m.team_b || null;
          let seed_a = m.seed_a != null ? m.seed_a : null;
          let seed_b = m.seed_b != null ? m.seed_b : null;
          const sourceA = mi * 2;
          const sourceB = mi * 2 + 1;
          if (!team_a) {
            team_a = prevWinners[sourceA] || null;
            if (team_a) seed_a = (seedings.indexOf(team_a) + 1) || null;
          }
          if (!team_b) {
            team_b = prevWinners[sourceB] || null;
            if (team_b) seed_b = (seedings.indexOf(team_b) + 1) || null;
          }
          return Object.assign({}, m, { team_a: team_a, team_b: team_b, seed_a: seed_a, seed_b: seed_b, entryNumber: mi + 1 });
        });
        rounds.push(Object.assign({}, rawRounds[ri], { matches: matches }));
        prevWinners = matches.map(function (m) { return m.winner || null; });
      }

      return rounds;
    }

    function playoffTeamLabel(team, seed, won) {
      return h('span', {},
        h('span', { style: won ? { color: '#16a34a', fontWeight: 700 } : (!team ? { color: '#a8a29e' } : {}) }, team || 'TBD'),
        seed != null ? h('span', { style: { fontSize: '11px', color: '#a8a29e' } }, ' (#' + seed + ')') : null
      );
    }

    function playoffMatchRow(match, key) {
      const isCompleted = match.status === 'completed';
      const aWon = isCompleted && match.winner && match.winner === match.team_a;
      const bWon = isCompleted && match.winner && match.winner === match.team_b;
      const hasScore = match.score_a != null && match.score_b != null;
      return h('div', {
        key: key,
        style: {
          display: 'flex', alignItems: 'center', gap: '10px', padding: '8px 12px',
          border: '1px solid #e7e5e4', borderRadius: '8px', marginBottom: '6px', backgroundColor: '#fff'
        }
      },
        h('span', {
          style: {
            fontSize: '11px', fontWeight: 700, color: 'white', backgroundColor: '#8b5cf6',
            borderRadius: '999px', padding: '2px 8px', flexShrink: 0, whiteSpace: 'nowrap'
          }
        }, 'Entry ' + match.entryNumber),
        h('div', { style: { fontSize: '14px', flex: 1 } },
          playoffTeamLabel(match.team_a, match.seed_a, aWon),
          '  vs  ',
          playoffTeamLabel(match.team_b, match.seed_b, bWon)
        ),
        hasScore ? h('span', { style: { fontSize: '12px', color: '#78716c', flexShrink: 0 } }, match.score_a + ' - ' + match.score_b) : null,
        h('span', {
          style: {
            fontSize: '11px', padding: '2px 8px', borderRadius: '999px', flexShrink: 0, whiteSpace: 'nowrap',
            backgroundColor: '#fef3c7', color: '#92400e'
          }
        }, match.status || 'upcoming')
      );
    }

    // Renders the full Playoffs section (seeding + bracket), or null if
    // there's no playoffs data yet.
    function renderPlayoffsSection(playoffs, kais, schedule) {
      if (!playoffs) return null;
      const rawRounds = playoffs.rounds || [];
      if (!rawRounds.length) return null;

      const manualSeedings = (playoffs.seedings || [])
        .map(function (s) { return (s && s.team) ? s.team : null; })
        .filter(Boolean);
      const seedings = manualSeedings.length ? manualSeedings : computeSeedings(kais, schedule);
      const derivedRounds = deriveRoundsForPreview(rawRounds, seedings);

      return h('div', { style: { marginTop: '24px' } },
        h('h2', { style: { fontSize: '16px', marginBottom: '8px' } }, '🏆 Playoffs'),
        h('p', { style: { fontSize: '12px', color: '#78716c', fontStyle: 'italic', marginBottom: '12px', lineHeight: 1.5 } },
          'Team names are computed live from seeding + the site\'s bracket pairing rules (or from the manual Seedings list, if filled in). Enter matches for each round in the order they should appear top-to-bottom in the bracket — "Entry N" below always matches that position in the Matches list for the round in the form.'
        ),
        seedings.length ? h('div', { style: { marginBottom: '16px' } },
          h('div', { style: { fontSize: '12px', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.05em', color: '#57534e', marginBottom: '6px' } },
            'Computed Seeding' + (manualSeedings.length ? ' (manual)' : ' (from standings)')
          ),
          h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px' } },
            seedings.map(function (team, i) {
              return h('span', {
                key: i,
                style: { fontSize: '12px', padding: '4px 8px', borderRadius: '6px', backgroundColor: '#f5f5f4', border: '1px solid #e7e5e4' }
              }, '#' + (i + 1) + ' ' + (team || '—'));
            })
          )
        ) : h('div', { style: { fontSize: '13px', color: '#a8a29e', marginBottom: '16px' } },
          'No seedings yet — add teams/records to your divisions or a manual Seedings list to resolve team names.'
        ),
        derivedRounds.map(function (round, ri) {
          return h('div', { key: ri, style: { marginBottom: '18px' } },
            h('div', { style: { fontSize: '13px', fontWeight: 700, color: '#57534e', textTransform: 'uppercase', letterSpacing: '0.03em', marginBottom: '6px' } },
              round.round || ('Round ' + (ri + 1))
            ),
            (round.matches || []).map(function (match, mi) { return playoffMatchRow(match, mi); })
          );
        })
      );
    }

    // --- Teams Preview ---
    const TeamsPreview = CMS.createClass({
      render: function () {
        const entry = this.props.entry;
        const teams = entry.getIn(['data', 'teams']);
        if (!teams) return CMS.h('div', {}, 'No teams data');

        return CMS.h('div', { style: { fontFamily: 'sans-serif', padding: '20px', maxWidth: '800px' } },
          CMS.h('h1', { style: { borderBottom: '3px solid #F97316', paddingBottom: '10px' } }, '🏆 Teams'),
          teams.map(function (team, i) {
            const name = team.get('name') || 'Unnamed';
            const color = team.get('color') || '#666';
            const desc = team.get('description') || '';
            const manager = team.get('manager') || '';
            const roster = team.get('roster');

            return CMS.h('div', {
              key: i,
              style: {
                marginBottom: '24px',
                padding: '16px',
                borderLeft: '4px solid ' + color,
                backgroundColor: '#f8f9fa',
                borderRadius: '0 8px 8px 0'
              }
            },
              CMS.h('div', { style: { display: 'flex', alignItems: 'center', gap: '12px', marginBottom: '8px' } },
                CMS.h('div', {
                  style: {
                    width: '40px', height: '40px', borderRadius: '8px',
                    backgroundColor: color, color: 'white',
                    display: 'flex', alignItems: 'center', justifyContent: 'center',
                    fontWeight: 'bold', fontSize: '18px'
                  }
                }, name.charAt(0)),
                CMS.h('div', {},
                  CMS.h('h2', { style: { margin: 0, fontSize: '18px' } }, name),
                  manager ? CMS.h('div', { style: { fontSize: '13px', color: '#666' } }, 'Manager: ' + manager) : null
                )
              ),
              desc ? CMS.h('p', { style: { fontSize: '14px', color: '#555', margin: '8px 0' } }, desc) : null,
              team.get('restrictions') ? CMS.h('div', { style: { marginTop: '8px', padding: '8px 12px', backgroundColor: '#fff3cd', borderLeft: '3px solid #f59e0b', borderRadius: '0 4px 4px 0', fontSize: '13px', color: '#555' } },
                CMS.h('strong', { style: { fontSize: '12px', textTransform: 'uppercase', color: '#d97706', letterSpacing: '0.05em' } }, 'Restrictions'),
                CMS.h('div', { style: { marginTop: '4px', whiteSpace: 'pre-wrap' } }, team.get('restrictions'))
              ) : null,
              roster ? CMS.h('div', { style: { display: 'flex', flexWrap: 'wrap', gap: '6px', marginTop: '8px' } },
                roster.map(function (char, j) {
                  return CMS.h('span', {
                    key: j,
                    style: {
                      padding: '4px 10px', borderRadius: '6px',
                      backgroundColor: '#e2e8f0', fontSize: '13px'
                    }
                  }, char);
                })
              ) : null
            );
          })
        );
      }
    });

    // --- Season Preview ---
    const SeasonPreview = CMS.createClass({
      render: function () {
        try {
          return this.renderSeason();
        } catch (err) {
          // If anything above throws, Decap silently swallows it and falls
          // back to the generic default preview (plain "Label: value"
          // dump) — which is confusing because it looks like the custom
          // preview was never written, rather than "it crashed." Surface
          // the actual error here instead so it's obvious what broke.
          return CMS.h('div', {
            style: {
              fontFamily: 'monospace', padding: '20px', backgroundColor: '#fef2f2',
              border: '2px solid #ef4444', borderRadius: '8px', color: '#991b1b',
              whiteSpace: 'pre-wrap', fontSize: '13px'
            }
          },
            CMS.h('strong', {}, '⚠️ SeasonPreview crashed: '),
            String(err && err.message ? err.message : err),
            '\n\n',
            String(err && err.stack ? err.stack : '')
          );
        }
      },
      renderSeason: function () {
        const entry = this.props.entry;
        const season = entry.getIn(['data', 'season']) || '';
        const status = entry.getIn(['data', 'status']) || '';
        const standings = entry.getIn(['data', 'standings']);
        const schedule = entry.getIn(['data', 'schedule']);
        const rawData = entry.getIn(['data']);
        const plainData = rawData && rawData.toJS ? rawData.toJS() : {};

        return CMS.h('div', { style: { fontFamily: 'sans-serif', padding: '20px', maxWidth: '800px' } },
          CMS.h('h1', { style: { borderBottom: '3px solid #22c55e', paddingBottom: '10px' } },
            '📅 ' + season
          ),
          CMS.h('span', {
            style: {
              display: 'inline-block', padding: '4px 12px', borderRadius: '20px',
              backgroundColor: status === 'Active' ? '#22c55e' : status === 'Completed' ? '#6366f1' : '#eab308',
              color: 'white', fontSize: '13px', fontWeight: 'bold', marginBottom: '16px'
            }
          }, status),

          // Standings table
          standings ? CMS.h('div', { style: { marginTop: '16px' } },
            CMS.h('h2', { style: { fontSize: '16px', marginBottom: '8px' } }, 'Standings'),
            CMS.h('table', {
              style: { width: '100%', borderCollapse: 'collapse', fontSize: '14px' }
            },
              CMS.h('thead', {},
                CMS.h('tr', { style: { backgroundColor: '#f1f5f9', textAlign: 'left' } },
                  CMS.h('th', { style: { padding: '8px' } }, '#'),
                  CMS.h('th', { style: { padding: '8px' } }, 'Team'),
                  CMS.h('th', { style: { padding: '8px', textAlign: 'center' } }, 'W'),
                  CMS.h('th', { style: { padding: '8px', textAlign: 'center' } }, 'L'),
                  CMS.h('th', { style: { padding: '8px', textAlign: 'center' } }, 'T'),
                  CMS.h('th', { style: { padding: '8px', textAlign: 'center' } }, 'Win%')
                )
              ),
              CMS.h('tbody', {},
                standings
                  .sortBy(function (s) { return -(s.get('wins') || 0); })
                  .map(function (s, i) {
                    var w = s.get('wins') || 0, l = s.get('losses') || 0, t = s.get('ties') || 0;
                    var total = w + l + t;
                    var wr = total > 0 ? Math.round((w / total) * 100) : 0;
                    return CMS.h('tr', {
                      key: i,
                      style: { borderBottom: '1px solid #e2e8f0' }
                    },
                      CMS.h('td', { style: { padding: '8px', color: '#999' } }, i + 1),
                      CMS.h('td', { style: { padding: '8px', fontWeight: '600' } }, s.get('team')),
                      CMS.h('td', { style: { padding: '8px', textAlign: 'center', color: '#22c55e' } }, w),
                      CMS.h('td', { style: { padding: '8px', textAlign: 'center', color: '#ef4444' } }, l),
                      CMS.h('td', { style: { padding: '8px', textAlign: 'center', color: '#999' } }, t),
                      CMS.h('td', { style: { padding: '8px', textAlign: 'center', fontWeight: '600' } }, wr + '%')
                    );
                  })
              )
            )
          ) : null,

          // Schedule
          schedule ? CMS.h('div', { style: { marginTop: '24px' } },
            CMS.h('h2', { style: { fontSize: '16px', marginBottom: '8px' } }, 'Schedule'),
            schedule.map(function (week, wi) {
              var matches = week.get('matches');
              return CMS.h('div', { key: wi, style: { marginBottom: '16px' } },
                CMS.h('h3', { style: { fontSize: '14px', color: '#666', marginBottom: '6px' } },
                  'Week ' + week.get('week')
                ),
                matches ? matches.map(function (m, mi) {
                  var s = m.get('status');
                  var done = s === 'completed';
                  var hs = m.get('home_score'), as = m.get('away_score');
                  return CMS.h('div', {
                    key: mi,
                    style: {
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      padding: '8px 12px', marginBottom: '4px',
                      backgroundColor: '#f8f9fa', borderRadius: '6px', fontSize: '14px'
                    }
                  },
                    CMS.h('span', { style: { flex: 1, fontWeight: done && hs > as ? 'bold' : 'normal' } }, m.get('home')),
                    done
                      ? CMS.h('span', { style: { fontWeight: 'bold', margin: '0 12px' } }, hs + ' - ' + as)
                      : CMS.h('span', { style: { margin: '0 12px', color: '#999', fontSize: '12px' } }, 'Upcoming'),
                    CMS.h('span', {
                      style: { flex: 1, textAlign: 'right', fontWeight: done && as > hs ? 'bold' : 'normal' }
                    }, m.get('away'))
                  );
                }) : null
              );
            })
          ) : null,

          // Playoffs (seeding + bracket, teams resolved live)
          renderPlayoffsSection(plainData.playoffs, plainData.kais, plainData.schedule)
        );
      }
    });

    // --- Site Settings Preview ---
    const SitePreview = CMS.createClass({
      render: function () {
        const entry = this.props.entry;
        return CMS.h('div', { style: { fontFamily: 'sans-serif', padding: '20px', maxWidth: '600px' } },
          CMS.h('h1', { style: { borderBottom: '3px solid #3b82f6', paddingBottom: '10px' } },
            '⚙️ ' + (entry.getIn(['data', 'site_name']) || 'Site Settings')
          ),
          CMS.h('div', { style: { padding: '12px', backgroundColor: '#f8f9fa', borderRadius: '8px', marginTop: '12px' } },
            CMS.h('div', { style: { marginBottom: '8px' } },
              CMS.h('strong', {}, 'Short Name: '), entry.getIn(['data', 'short_name']) || ''
            ),
            CMS.h('div', { style: { marginBottom: '8px' } },
              CMS.h('strong', {}, 'Tagline: '), entry.getIn(['data', 'tagline']) || ''
            ),
            CMS.h('div', { style: { marginBottom: '8px' } },
              CMS.h('strong', {}, 'Season: '), entry.getIn(['data', 'current_season']) || ''
            ),
            CMS.h('div', { style: { marginBottom: '8px' } },
              CMS.h('strong', {}, 'Status: '), entry.getIn(['data', 'current_season_status']) || ''
            ),
            CMS.h('p', { style: { marginTop: '12px', color: '#555', fontSize: '14px' } },
              entry.getIn(['data', 'description']) || ''
            )
          )
        );
      }
    });

    // --- Community Preview ---
    const CommunityPreview = CMS.createClass({
      render: function () {
        const entry = this.props.entry;
        const roles = entry.getIn(['data', 'roles']);
        const resources = entry.getIn(['data', 'resources']);

        return CMS.h('div', { style: { fontFamily: 'sans-serif', padding: '20px', maxWidth: '800px' } },
          CMS.h('h1', { style: { borderBottom: '3px solid #ec4899', paddingBottom: '10px' } },
            '💜 ' + (entry.getIn(['data', 'title']) || 'Community')
          ),
          CMS.h('p', { style: { color: '#555', marginBottom: '16px' } }, entry.getIn(['data', 'intro']) || ''),

          roles ? CMS.h('div', {},
            CMS.h('h2', { style: { fontSize: '16px', marginBottom: '8px' } }, 'Volunteer Roles'),
            roles.map(function (role, i) {
              return CMS.h('div', {
                key: i,
                style: {
                  padding: '12px', marginBottom: '8px',
                  backgroundColor: '#f8f9fa', borderRadius: '8px',
                  borderLeft: '3px solid #ec4899'
                }
              },
                CMS.h('strong', {}, role.get('name')),
                CMS.h('p', { style: { fontSize: '13px', color: '#555', margin: '4px 0 0' } }, role.get('description'))
              );
            })
          ) : null,

          resources ? CMS.h('div', { style: { marginTop: '16px' } },
            CMS.h('h2', { style: { fontSize: '16px', marginBottom: '8px' } }, 'Resources'),
            resources.map(function (res, i) {
              return CMS.h('div', {
                key: i,
                style: {
                  padding: '12px', marginBottom: '8px',
                  backgroundColor: '#f0f9ff', borderRadius: '8px',
                  borderLeft: '3px solid #3b82f6'
                }
              },
                CMS.h('strong', {}, res.get('name')),
                CMS.h('p', { style: { fontSize: '13px', color: '#555', margin: '4px 0 0' } }, res.get('description'))
              );
            })
          ) : null
        );
      }
    });

    // Register all preview templates
    CMS.registerPreviewTemplate('settings', SitePreview);
    CMS.registerPreviewTemplate('teams', TeamsPreview);
    CMS.registerPreviewTemplate('seasons', SeasonPreview);
    CMS.registerPreviewTemplate('community', CommunityPreview);
  </script>
</body>
</html>
