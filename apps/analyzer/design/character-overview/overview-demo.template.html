<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Character Overview Demo</title>
<style>
  /* Build-type colours are the app's existing ones (buildComposition.js getBuildTypeColor),
     so a capsule, a build pill and a style axis of the same kind always share a colour. */
  :root {
    --bg: #0b0f17; --panel: #111827; --panel2: #0f1623; --line: #1f2937; --line2: #273244;
    --text: #e5e7eb; --muted: #9ca3af; --faint: #6b7280;
    --accent: #f97316; --good: #22c55e; --bad: #ef4444; --mid: #94a3b8;
    --melee: #f87171; --blast: #fb923c; --ki: #facc15; --skill: #c084fc; --defense: #60a5fa;
    --kieff: #4ade80; --utility: #9ca3af; --ult: #f472b6;
    color-scheme: dark; /* dark scrollbars in the build menu */
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #f3f4f6; --panel: #ffffff; --panel2: #f9fafb; --line: #e5e7eb; --line2: #d1d5db;
    --text: #111827; --muted: #4b5563; --faint: #9ca3af; --mid: #64748b;
    --melee: #dc2626; --blast: #ea580c; --ki: #ca8a04; --skill: #9333ea; --defense: #2563eb;
    --kieff: #16a34a; --utility: #6b7280; --ult: #db2777;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  button { font: inherit; }
  .wrap { max-width: 1060px; margin: 0 auto; padding: 16px; }
  .controls { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 10px 12px; border: 1px dashed var(--line2); border-radius: 8px; margin-bottom: 18px; font-size: 12px; color: var(--muted); }
  .controls b { color: var(--text); font-weight: 600; margin-right: 4px; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button { font-size: 12px; padding: 4px 9px; border-radius: 6px; border: 1px solid var(--line2); background: transparent; color: var(--muted); cursor: pointer; }
  .seg button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: #111; font-weight: 600; }

  /* identity */
  .ident { display: flex; align-items: center; gap: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .ident h1 { margin: 0; font-size: 24px; letter-spacing: -.01em; line-height: 1.15; }
  .ident .meta { display: flex; align-items: center; gap: 10px; margin-top: 5px; color: var(--muted); font-size: 12.5px; }
  .tabs { display: flex; gap: 18px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .tabs span { padding: 9px 0; color: var(--faint); }
  .tabs span.on { color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); font-weight: 600; }

  /* score pill: mirrors PerformanceScoreBadge (tier colour, star, rounded-lg) */
  .spill { display: inline-flex; align-items: center; gap: 4px; font-weight: 700; font-size: 12px; padding: 1px 7px; border-radius: 8px; border: 1px solid; white-space: nowrap; font-variant-numeric: tabular-nums; }
  .spill svg { width: 11px; height: 11px; }
  .spill.z { animation: szl-z-breathe 2.6s ease-in-out infinite; }
  .spill.prov { filter: saturate(.45); opacity: .62; } /* the tier plate's provisional treatment */
  @keyframes szl-z-breathe {
    0%, 100% { box-shadow: 0 0 4px rgba(224, 40, 74, 0.35); }
    50%      { box-shadow: 0 0 14px rgba(224, 40, 74, 0.75), 0 0 2px rgba(224, 40, 74, 0.9); }
  }
  @media (prefers-reduced-motion: reduce) { .spill.z { animation: none; } }

  /* shown only while a build is selected, so a filtered view never passes for the whole picture */
  .banner { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 12px 0 0; padding: 7px 12px; border-radius: 8px; background: color-mix(in srgb, var(--accent) 9%, transparent); border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent); font-size: 12.5px; }
  .banner .x { color: var(--muted); }
  .clear { font-size: 12px; color: var(--accent); background: none; border: 0; cursor: pointer; text-decoration: underline; padding: 0; margin-left: auto; }

  .k { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
  .h { font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--faint); margin: 0; }
  .x { color: var(--faint); font-weight: 500; font-size: 12px; font-variant-numeric: tabular-nums; }
  #page { margin-top: 16px; }

  /* ---------- headline ---------- */
  .tiles { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
  .tile { background: var(--panel); padding: 12px 14px; min-width: 0; }
  .tile .val { font-size: 26px; font-weight: 750; letter-spacing: -.02em; font-variant-numeric: tabular-nums; margin: 2px 0 7px; white-space: nowrap; }
  .tile .val small { font-size: 12px; font-weight: 500; color: var(--muted); margin-left: 3px; }
  .track { position: relative; height: 6px; border-radius: 3px; background: var(--line2); }
  .track .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; }
  .track .med { position: absolute; top: -3px; bottom: -3px; width: 2px; left: 50%; background: var(--muted); opacity: .7; }
  .track .dot { position: absolute; top: 50%; width: 11px; height: 11px; border-radius: 50%; transform: translate(-50%, -50%); border: 2px solid var(--panel); }
  .rank { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 11.5px; color: var(--muted); margin-top: 6px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .rank .lgv { font-weight: 500; color: var(--muted); white-space: nowrap; }
  .move { cursor: help; }

  .moves { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin-top: 8px; }
  .move { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; align-items: center; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 9px 11px; min-width: 0; }
  .move .icon { grid-row: span 3; }
  .move .v { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .move .v small { color: var(--muted); font-weight: 500; font-size: 11.5px; }
  .move .c { font-size: 11.5px; color: var(--muted); white-space: nowrap; font-weight: 600; }

  /* ---------- style band ---------- */
  .style { margin-top: 26px; display: grid; grid-template-columns: 290px 1fr; gap: 30px; align-items: start; }
  .buildpick { position: relative; margin-bottom: 18px; }
  .picker { width: 100%; display: flex; align-items: center; gap: 8px; margin-top: 5px; padding: 7px 10px; border-radius: 8px; border: 1px solid var(--line2); background: var(--panel); color: var(--text); cursor: pointer; font-size: 13px; text-align: left; }
  .picker:hover { border-color: var(--muted); }
  .picker[data-active="true"] { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .picker .grow { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .picker .caret { color: var(--faint); font-size: 11px; }
  .menu { position: absolute; top: calc(100% + 6px); left: 0; z-index: 5; width: min(390px, calc(100vw - 32px)); max-height: min(430px, 70vh); overflow: auto; background: var(--panel); border: 1px solid var(--line2); border-radius: 10px; box-shadow: 0 12px 30px rgba(0,0,0,.35); padding: 6px; }
  .opt { display: grid; grid-template-columns: 1fr auto; gap: 3px 12px; align-items: center; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 8px 10px; color: var(--text); cursor: pointer; }
  .opt:hover, .opt[aria-selected="true"] { background: var(--panel2); }
  .opt[aria-selected="true"] { box-shadow: inset 3px 0 0 var(--accent); }
  .opt .o2 { font-size: 12px; color: var(--muted); }
  .opt .o4 { grid-column: 1 / 3; font-size: 11.5px; color: var(--faint); }
  .opt .o3 { font-size: 12px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .opt + .opt { border-top: 1px solid var(--line); border-radius: 0 0 7px 7px; }

  .label-card { border-left: 3px solid var(--c, var(--accent)); padding: 2px 0 2px 14px; }
  .label-card h2 { margin: 2px 0 0; font-size: 26px; letter-spacing: -.02em; line-height: 1.15; color: var(--c, var(--text)); }
  .label-card h2 .second { display: block; font-size: 20px; margin-top: 1px; }
  .block { margin-top: 18px; }
  .block .top { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 7px; }
  .bpill { display: inline-block; font-size: 12px; font-weight: 700; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--c); color: var(--c); background: color-mix(in srgb, var(--c) 12%, transparent); white-space: nowrap; }
  .costbar { display: flex; height: 7px; border-radius: 4px; overflow: hidden; margin: 8px 0; background: var(--line); gap: 2px; }
  .costbar span { background: var(--c); }
  .caplist { list-style: none; margin: 0; padding: 0; }
  .caplist li { display: grid; grid-template-columns: 10px 1fr auto; gap: 8px; align-items: center; padding: 4px 0; font-size: 13px; border-top: 1px solid var(--line); }
  .caplist li:first-child { border-top: 0; }
  .caplist .sw { width: 8px; height: 8px; border-radius: 2px; background: var(--c); }
  .caplist .cost { color: var(--faint); font-variant-numeric: tabular-nums; font-size: 12px; }
  .ai { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .ai .v { font-size: 13.5px; font-weight: 650; margin-top: 3px; }

  .stylehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
  .headright { display: flex; align-items: center; gap: 14px; }
  .legend { font-size: 11.5px; color: var(--faint); white-space: nowrap; }
  .legend i { display: inline-block; width: 2px; height: 11px; background: var(--muted); vertical-align: -2px; margin-right: 5px; }
  .legend .dash { display: inline-block; width: 18px; border-top: 2px dashed var(--muted); vertical-align: 3px; margin-right: 5px; }
  .toggle { display: inline-flex; border: 1px solid var(--line2); border-radius: 7px; overflow: hidden; }
  .toggle button { font-size: 12px; padding: 4px 10px; background: none; border: 0; color: var(--muted); cursor: pointer; }
  .toggle button[aria-pressed="true"] { background: var(--line2); color: var(--text); font-weight: 600; }

  .bars { display: grid; gap: 12px; }
  /* Aligned columns instead of "value · rank" text: this character, the league median, the rank. */
  .barshead, .bar { display: grid; grid-template-columns: 92px 1fr 56px 56px 96px; gap: 4px 12px; align-items: center; }
  .barshead { font-size: 10.5px; color: var(--faint); text-transform: uppercase; letter-spacing: .06em; font-weight: 700; margin-bottom: -4px; }
  .barshead span:nth-child(n+3) { text-align: right; }
  .bar .lg { font-size: 12.5px; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
  .bar .rk { justify-self: end; }
  /* Rank chip, on the same red -> green scale as the headline stats. */
  .rchip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 1px 8px; border-radius: 999px; color: var(--rc); white-space: nowrap; font-variant-numeric: tabular-nums;
           background: color-mix(in srgb, var(--rc) 14%, transparent); border: 1px solid color-mix(in srgb, var(--rc) 50%, transparent); }
  .bar .ax { font-weight: 650; font-size: 13px; display: flex; align-items: center; gap: 7px; }
  .sw { width: 9px; height: 9px; border-radius: 2px; background: var(--c); flex: none; }
  .ptrack { position: relative; height: 12px; border-radius: 6px; background: var(--line); }
  .ptrack .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 6px; background: var(--c); opacity: .85; }
  .ptrack .med { position: absolute; top: -4px; bottom: -4px; left: 50%; width: 2px; background: var(--muted); }
  .bar .num { font-size: 13px; font-weight: 650; color: var(--text); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
  .bar .sub { grid-column: 2 / 6; display: grid; grid-template-columns: repeat(2, max-content); gap: 3px 18px; font-size: 11.5px; color: var(--muted); }
  .sub .part { cursor: help; }
  .sub .part { display: inline-flex; align-items: center; gap: 6px; }
  .sub b { color: var(--text); font-weight: 600; font-variant-numeric: tabular-nums; }
  .mini { position: relative; width: 46px; height: 5px; border-radius: 3px; background: var(--line); }
  .mini .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 3px; background: var(--c); opacity: .75; }
  .mini .med { position: absolute; top: -2px; bottom: -2px; left: 50%; width: 2px; background: var(--muted); }

  .radarbox { position: relative; max-width: 440px; margin: -6px auto 0; }
  .radar { display: block; width: 100%; height: auto; }
  .radar .hit { cursor: help; }
  .rlabel { position: absolute; font: 650 12px system-ui, sans-serif; color: var(--c); cursor: help; white-space: nowrap; line-height: 1.25; }
  /* The name is its own line (so the rank stays below it), with the style square inline. */
  .rlabel .rname { display: block; }
  .rlabel .rname .sw { display: inline-block; margin-right: 6px; vertical-align: 0; }
  .rlabel .rchip, .rlabel .rtext { margin-top: 3px; display: inline-block; }
  .rof { color: var(--faint); font-weight: 500; }
  .rtext { font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  /* Rank beside the style name instead of its own column. */
  .bars.rk-name .barshead, .bars.rk-name .bar { grid-template-columns: 136px 1fr 56px 56px; }
  .bars.rk-name .bar .sub { grid-column: 2 / 5; }
  .ax .axr { margin-left: auto; padding-left: 8px; }
  .ax .axr .rtext { font-size: 12px; }

  /* One tooltip for the page: radar dots and names, and the sub-bars. */
  #tip { position: fixed; z-index: 20; pointer-events: none; background: var(--panel); color: var(--text); border: 1px solid var(--line2); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 10px 24px rgba(0,0,0,.35); }
  #tip .tt { font-weight: 700; margin-bottom: 5px; }
  #tip table { border-collapse: collapse; font-variant-numeric: tabular-nums; }
  #tip th { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--faint); font-weight: 700; text-align: right; padding: 0 0 3px 14px; }
  #tip td { padding: 2px 0 2px 14px; text-align: right; font-weight: 650; }
  #tip td:first-child { padding-left: 0; text-align: left; color: var(--muted); font-weight: 500; }
  #tip td:nth-child(3) { color: var(--muted); font-weight: 500; }
  #tip .tf { margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--line); color: var(--muted); }
  #tip .tf b { color: var(--text); }

  details.note { margin-top: 32px; font-size: 12px; color: var(--muted); border: 1px dashed var(--line2); border-radius: 8px; padding: 8px 12px; }
  details.note summary { cursor: pointer; color: var(--faint); }
  details.note b { color: var(--text); }
  details.note ul { margin: 6px 0 0; padding-left: 18px; }

  @media (max-width: 1000px) { .moves { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 860px) {
    .tiles { grid-template-columns: repeat(2, 1fr); }
    .tiles .tile:last-child { grid-column: span 2; }
    .tile .val { font-size: 22px; }
    .moves { grid-template-columns: repeat(2, 1fr); }
    .style { grid-template-columns: 1fr; }
    .barshead, .bar { grid-template-columns: 72px 1fr 44px 44px 78px; gap: 4px 7px; }
    .barshead { font-size: 9px; letter-spacing: .03em; white-space: nowrap; }
    .bar .num, .bar .lg { font-size: 11.5px; }
    .bar .ax { font-size: 12px; }
    .rchip { font-size: 10.5px; padding: 1px 6px; }
    .bar .sub { grid-column: 1 / 6; }
    .rlabel { font-size: 11px; }
    .bars.rk-name .barshead, .bars.rk-name .bar { grid-template-columns: 112px 1fr 44px 44px; }
    .bars.rk-name .bar .sub { grid-column: 1 / 5; }
    .headright .legend { display: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="controls">
    <div><b>Demo character</b><span class="seg" id="chars"></span></div>
    <div><b>Theme</b><span class="seg" id="theme"></span></div>
  </div>

  <div class="ident" id="ident"></div>
  <div class="tabs"><span class="on">Overview</span><span>Builds</span><span>Forms</span><span>Matches</span></div>
  <div id="banner"></div>
  <div id="page"></div>

  <details class="note" id="note"></details>
  <div id="tip" role="tooltip" hidden></div>
</div>

<script>
const DATA = /*DATA*/null;

// Display order, as the league asked: top to bottom in Bars, clockwise from the top in Radar.
const STYLES = [
  { key: 'melee',   name: 'Melee',     label: 'Melee Fighter',     color: 'var(--melee)',   rate: 'melee', dp: 1 },
  { key: 'ki',      name: 'Ki Blasts', label: 'Ki-Blast Spammer',  color: 'var(--ki)',      rate: 'ki',    dp: 1 },
  { key: 'blast',   name: 'Blasts',    label: 'Blast User',        color: 'var(--blast)',   rate: 'blast', dp: 2 },
  { key: 'ult',     name: 'Ultimates', label: 'Ult Spammer',       color: 'var(--ult)',     rate: 'ult',   dp: 2 },
  { key: 'skill',   name: 'Skills',    label: 'Skill User',        color: 'var(--skill)',   rate: 'skill', dp: 2 },
  { key: 'defense', name: 'Defense',   label: 'Defensive Fighter', color: 'var(--defense)', rate: null,    dp: 0 },
];
const CAP_COLOR = { 'melee': 'var(--melee)', 'blast': 'var(--blast)', 'ki blast': 'var(--ki)', 'skill': 'var(--skill)', 'defense': 'var(--defense)', 'ki efficiency': 'var(--kieff)', 'utility': 'var(--utility)' };
// Same precedence as getBuildTypeColor() so the pill matches the leaderboard's.
function buildColor(label) {
  const l = label.toLowerCase();
  if (l.includes('melee')) return CAP_COLOR.melee;
  if (l.includes('ki blast')) return CAP_COLOR['ki blast'];
  if (l.includes('blast')) return CAP_COLOR.blast;
  if (l.includes('defense')) return CAP_COLOR.defense;
  if (l.includes('skill')) return CAP_COLOR.skill;
  if (l.includes('ki efficiency')) return CAP_COLOR['ki efficiency'];
  if (l.includes('balanced') || l.includes('hybrid')) return CAP_COLOR.skill;
  return 'var(--utility)';
}

const nf = (v, d = 0) => Number(v).toLocaleString(undefined, { minimumFractionDigits: d, maximumFractionDigits: d });
// Per-match averages: one decimal, but two when a real value would otherwise round to 0.0
// (one ultimate across 38 matches is 0.03, not nothing).
const nd = x => x > 0 && x < 0.095 ? nf(x, 2) : nf(x, 1);
const mmss = s =>`${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
// Ranks are flat leaderboard positions - "#6", where #1 is always the top. How many
// characters they are out of is said once on the page, and in full in tooltips (hit
// rates are ranked among fewer: only characters who threw one). For damage taken #1
// takes the least; for battle time #1 fights the longest; for a style #1 does it most.
function rankText(v, key) {
  const r = v.rank && v.rank[key];
  if (r == null) return '-';
  return `#${r}<span class="rof">/${DATA.rankN[key]}</span>`;
}
function rankFull(v, key) {
  const r = v.rank && v.rank[key];
  return r == null ? '-' : `#${r} of ${DATA.rankN[key]}`;
}
// Rank colour: only the ends of the league are coloured - the top fifth green (#1-#25 of
// 126), the bottom fifth red (#102-#126). Everything between is neutral grey, so colour
// only appears where a character genuinely stands out. Used where more is better (damage,
// efficiency, hit rates) and on the style ranks (#1 = does it most); battle time and skill
// uses stay neutral. Dark: a true red (a deeper crimson falls below 4.5:1 on the dark
// panel) and a vivid green; light: crimson and a deep green. All >= 4.5:1 as text.
const RANK_ENDS = { dark: ['#ff2b3a', '#16e05a'], light: ['#c8102e', '#047a2e'] };
const NEUTRAL = 'var(--mid)';
function rankChip(p, text, zero) {
  const col = zero ? 'var(--faint)' : rankColor(p);
  if (state.marker === 'pill') return `<span class="rchip" style="--rc:${col}">${text}</span>`;
  if (state.marker === 'text') return `<span class="rtext" style="color:${col}">${text}</span>`;
  return `<span class="rtext" style="color:${zero ? 'var(--faint)' : 'var(--text)'}">${text}</span>`;
}
// Style-band fill colour for a bar, dot or mini bar: the style's hue, its rank colour, or neutral.
function styleFill(styleColor, p, zero) {
  if (state.barColor === 'rank') return zero ? 'var(--faint)' : rankColor(p);
  if (state.barColor === 'neutral') return 'var(--mid)';
  return styleColor;
}
// Tooltip body: a small Me / League table, with the rank underneath.
function tipTable(title, rows, foot) {
  return encodeURIComponent(`<div class="tt">${title}</div><table><tr><th></th><th>Me</th><th>League</th></tr>${
    rows.map(([k, a, b]) => `<tr><td>${k}</td><td>${a}</td><td>${b}</td></tr>`).join('')}</table>${foot ? `<div class="tf">${foot}</div>` : ''}`);
}
function rankColor(p) {
  const [bad, good] = RANK_ENDS[state.theme === 'light' ? 'light' : 'dark'];
  if (p >= 80) return good;
  if (p < 20) return bad;
  return NEUTRAL;
}
// Provisional: the same rank colour, desaturated and dimmed - the treatment the tier
// plate gives a thin sample (saturate .45, opacity .62) - so a rank drawn from a
// handful of throws still shows its direction without claiming full confidence.
function provisionalColor(p) {
  const col = rankColor(p);
  if (col === NEUTRAL) return 'var(--faint)';
  const [r, g, b] = [1, 3, 5].map(o => parseInt(col.slice(o, o + 2), 16));
  const y = 0.2126 * r + 0.7152 * g + 0.0722 * b;
  const d = c => Math.round(y + (c - y) * 0.45);
  return `rgba(${d(r)},${d(g)},${d(b)},0.62)`;
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const STAR = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>';

// Light mode: the dark-mode pill uses the tier's LIGHT letter colour as text, which is
// unreadable on white. Use the tier's deep PLATE colour instead (the letter's deep tone is
// still too bright for gold on white), on a pale tint. Z keeps its dark fill in both
// themes - it was designed to stand out, and it reads on white too.
function pillColors(tier) {
  if (state.theme !== 'light' || tier === 'Z') return DATA.tiers.pills[tier] || {};
  const [, deep] = (DATA.tiers.art[tier] || DATA.tiers.art.C).plate;
  return { background: deep + '14', color: deep, borderColor: deep + '99' };
}
function scorePill(v, label = '') {
  const c = pillColors(v.tier);
  const style = `background:${c.background};color:${c.color};border-color:${c.borderColor};${c.boxShadow ? 'box-shadow:' + c.boxShadow : ''}`;
  // Under 5 matches the score is provisional: dimmed the way the tier plate is.
  const title = v.provisional ? `Tier ${v.tier}, provisional: under 5 matches` : `Tier ${v.tier}`;
  return `<span class="spill ${v.tier === 'Z' ? 'z' : ''} ${v.provisional ? 'prov' : ''}" style="${style}" title="${title}">${STAR}${label}${Math.round(v.score)}</span>`;
}

function styleOf(v) {
  const ranked = STYLES.map(s => ({ ...s, p: v.pct['style_' + s.key] })).sort((x, y) => y.p - x.p);
  const strong = ranked.filter(s => s.p >= 75);
  if (!strong.length) return { html: 'All-Rounder', color: 'var(--text)' };
  if (strong.length === 1 || strong[0].p - strong[1].p >= 15) return { html: strong[0].label, color: strong[0].color };
  return { html: `${strong[0].label}<span class="second" style="color:${strong[1].color}">${strong[1].label}</span>`, color: strong[0].color };
}

function identHTML(c, v) {

// ---- headline ---------------------------------------------------------------
function tiles(v) {
  const M = DATA.medians;
  const t = [
    ['Damage dealt', nf(v.avgDealt), '/ match', v.pct.avgDealt, 'avgDealt', nf(M.avgDealt)],
    ['Damage taken', nf(v.avgTaken), '/ match', 100 - v.pct.avgTaken, 'avgTaken', nf(M.avgTaken)],
    ['Efficiency', nf(v.efficiency, 2), '×', v.pct.efficiency, 'efficiency', nf(M.efficiency, 2) + '×'],
    ['Damage / sec', nf(v.dps), '', v.pct.dps, 'dps', nf(M.dps)],
    ['Battle time', mmss(v.avgTime), 'avg', v.pct.avgTime, 'avgTime', mmss(M.avgTime), true],
  ];
  // The league median sits on the rank's line, not in a tooltip: these are the headline
  // comparisons, the tiles have room, and a phone has no hover.
  return `<div class="tiles">${t.map(([lbl, val, sm, p, key, league, neutral]) =>
    `<div class="tile"><div class="k">${lbl}</div><div class="val">${val}<small>${sm}</small></div>
      ${trackHTML(p, neutral)}
      <div class="rank"><span style="color:${neutral ? 'var(--muted)' : rankColor(p)}">${rankText(v, key)}</span><span class="lgv">League ${league}</span></div></div>`
  ).join('')}</div>`;
}
// The whole bar takes the one colour its rank earns, like the rings below it. Battle
// time is neutral (longer is not simply better), so it stays grey.
function trackHTML(p, neutral) {
  const col = neutral ? NEUTRAL : rankColor(p);
  return `<div class="track"><div class="fill" style="width:${p}%;background:${col}${col === NEUTRAL ? ';opacity:.45' : ''}"></div>
    <div class="med"></div><div class="dot" style="left:${p}%;background:${col}"></div></div>`;
}
// Hit-rate donut, with a light tick where the league median sits (same grey as the tiles' median).
function ring(rate, color, median, dim = false) {
  const r = 16, C = 2 * Math.PI * r, v = rate === null ? 0 : Math.min(1, rate);
  const a = -Math.PI / 2 + 2 * Math.PI * median;
  const tick = `<line x1="${21 + Math.cos(a) * 15.5}" y1="${21 + Math.sin(a) * 15.5}" x2="${21 + Math.cos(a) * 22}" y2="${21 + Math.sin(a) * 22}" stroke="var(--muted)" stroke-opacity=".7" stroke-width="2" stroke-linecap="round"/>`;
  return `<svg class="icon" width="56" height="56" viewBox="0 0 42 42" style="overflow:visible"><circle cx="21" cy="21" r="${r}" fill="none" stroke="var(--line2)" stroke-width="5"/>
    <circle cx="21" cy="21" r="${r}" fill="none" stroke="${color}"${dim ? ' stroke-opacity=".4"' : ''} stroke-width="5" stroke-linecap="round" stroke-dasharray="${C * v} ${C}" transform="rotate(-90 21 21)"/>${tick}
    <text x="21" y="${v >= 0.995 ? 24.5 : 25}" text-anchor="middle" style="font:700 ${v >= 0.995 ? 9 : 10.5}px system-ui;fill:var(--text)">${rate === null ? '-' : Math.round(v * 100) + '%'}</text></svg>`;
}
// Skill-use circle: fills with purple as use grows (by area, capped at the league's
// 95th percentile), with a dashed ring at the league median.
function skillCircle(per, median, top, color = 'var(--skill)') {
  const R = 19, rad = x => R * Math.sqrt(Math.min(1, Math.max(0, x / top)));
  const fillR = per > 0 ? Math.max(2.5, rad(per)) : 0;
  return `<svg class="icon" width="56" height="56" viewBox="0 0 42 42"><circle cx="21" cy="21" r="${R}" fill="none" stroke="var(--line2)" stroke-width="1.5"/>
    ${fillR ? `<circle cx="21" cy="21" r="${fillR.toFixed(1)}" fill="${color}" fill-opacity=".85"/>` : ''}
    <circle cx="21" cy="21" r="${Math.max(2, rad(median)).toFixed(1)}" fill="none" stroke="var(--muted)" stroke-opacity=".9" stroke-width="1.3" stroke-dasharray="2.5 2"/></svg>`;
}
const MIN_THROWS = 10;
function moves(v) {
  // A hit rate is only RANKED from MIN_THROWS throws up: 6/6 is 100%, but one more miss
  // makes it 83%, and ranking that against characters measured over hundreds of throws
  // would turn luck into "Top 1%". Below the floor the real rate still shows in its rank
  // colour, but provisional (dimmed, like a thin-sample tier plate), and the caption
  // says why - the per-match average alone (1.2/1.2) hides how few throws it comes from.
  const pc = x => Math.round(x * 100) + '%';
  // The donut wears the move's style colour (Supers = Blasts, Ultimate, Ki Blasts), like the
  // skill circles; the rank colour stays on the rank text alone. A thin sample fades both.
  const hitCard = (nm, [hit, thrown], total, k, volKey, styleCol, verb = 'Thrown') => {
    const rate = thrown ? hit / thrown : null, thin = total !== undefined && total > 0 && total < MIN_THROWS;
    const col = rate === null ? 'var(--faint)' : thin ? provisionalColor(v.pct[k]) : rankColor(v.pct[k]);
    const c = rate === null ? 'Never used' : thin ? `Only ${total} thrown` : rankText(v, k);
    const foot = rate === null ? '' : thin ? `Rank ${rankFull(v, k)}, provisional: only ${total} thrown` : `Rank <b>${rankFull(v, k)}</b>`;
    const tip = tipTable(nm, [
      [`${verb} per match`, nd(thrown), nd(DATA.medians[volKey])],
      ['Hit rate', rate === null ? '-' : pc(rate), pc(DATA.medians[k])],
    ], foot);
    return `<div class="move" tabindex="0" data-tip="${tip}">${ring(rate, rate === null ? 'var(--faint)' : styleCol, DATA.medians[k], thin)}<div class="k">${nm}</div>
      <div class="v">${nd(hit)}/${nd(thrown)}</div><div class="c" style="color:${col}">${c}</div></div>`;
  };
  // Ki blasts show VOLUME, not a hit rate. The game credits a deflected enemy blast that
  // lands as the deflector's own ki-blast hit, and records no way to separate them, so a
  // hit rate would reward characters who deflect a lot. Blasts fired is recorded directly.
  const kiCard = () => {
    const per = v.kiBlasts[1], k = 'kiFired';
    const tip = tipTable('Ki blasts', [['Fired per match', nf(per, 1), nf(DATA.medians[k], 1)]], per ? `Rank <b>${rankFull(v, k)}</b>` : '');
    return `<div class="move" tabindex="0" data-tip="${tip}">${skillCircle(per, DATA.medians[k], DATA.p95[k], 'var(--ki)')}<div class="k">Ki blasts</div>
      <div class="v">${nf(per, 1)}<small> fired</small></div><div class="c">${per ? rankText(v, k) : 'Never used'}</div></div>`;
  };
  const skillCard = (nm, per, k) => `<div class="move" tabindex="0" data-tip="${tipTable(nm, [['Uses per match', nf(per, 2), nf(DATA.medians[k], 2)]], per ? `Rank <b>${rankFull(v, k)}</b>` : '')}">${skillCircle(per, DATA.medians[k], DATA.p95[k])}<div class="k">${nm}</div>
      <div class="v">${nf(per, 2)}<small> uses</small></div><div class="c">${per ? rankText(v, k) : 'Never used'}</div></div>`;
  return `<div class="moves">
    ${hitCard('Super 1', v.blasts.s1, v.blastTotals.s1, 's1Rate', 's1Thrown', 'var(--blast)')}
    ${hitCard('Super 2', v.blasts.s2, v.blastTotals.s2, 's2Rate', 's2Thrown', 'var(--blast)')}
    ${hitCard('Ultimate', v.blasts.ult, v.blastTotals.ult, 'ultRate', 'ultThrown', 'var(--ult)')}
    ${kiCard()}
    ${skillCard('Skill 1', v.skills.s1, 'skill1')}
    ${skillCard('Skill 2', v.skills.s2, 'skill2')}
  </div>`;
}

// ---- style band -------------------------------------------------------------
// Builds sharing a build type AND an AI read identically in the menu's four fields.
// For those only, list the capsules each has that the others in its group do not all
// share (at most three, then "+N").
function lookalikeNotes(builds) {
  const groups = {};
  builds.forEach((b, i) => (groups[b.label + '|' + b.aiName] ??= []).push(i));
  const notes = {};
  for (const idx of Object.values(groups)) {
    if (idx.length < 2) continue;
    const sets = idx.map(i => builds[i].capsules.map(c => c.name));
    const common = sets[0].filter(n => sets.every(s => s.includes(n)));
    idx.forEach((i, j) => {
      const own = sets[j].filter(n => !common.includes(n));
      notes[i] = own.length
        ? own.slice(0, 3).map(esc).join(', ') + (own.length > 3 ? `, +${own.length - 3} more` : '')
        : 'Only the shared capsules';
    });
  }
  return notes;
}
function pickerHTML(c) {
  const b = view.build;
  const all = `<button class="opt" role="option" aria-selected="${state.build === null}" data-i="-1">
      <span><b>All builds</b></span>${scorePill(c)}
      <span class="o2">${c.buildCount} builds</span><span class="o3">${c.matches} uses</span></button>`;
  // Four things per build, as agreed: build type, AI strategy, uses, performance score.
  // A fifth line appears ONLY for look-alikes (same type and AI), naming what sets each apart.
  const notes = lookalikeNotes(c.builds);
  const list = c.builds.map((x, i) => `<button class="opt" role="option" aria-selected="${state.build === i}" data-i="${i}">
      <span><span class="bpill" style="--c:${buildColor(x.label)}">${esc(x.label)}</span></span>${scorePill(x)}
      <span class="o2">${esc(x.aiName)}</span><span class="o3">${x.matches} use${x.matches === 1 ? '' : 's'}</span>
      ${notes[i] ? `<span class="o4">${notes[i]}</span>` : ''}</button>`).join('');
  return `<div class="k">Build</div>
    <button class="picker" id="picker" data-active="${!!b}" aria-haspopup="listbox" aria-expanded="${state.menu}">
      <span class="grow">${b ? `<span class="bpill" style="--c:${buildColor(b.label)}">${esc(b.label)}</span>${scorePill(b)}` : `All builds <span class="x">(${c.buildCount})</span>`}</span>
      <span class="caret">▼</span></button>
    ${state.menu ? `<div class="menu" role="listbox">${all}${list}</div>` : ''}`;
}
function buildBlock(c) {
  const b = view.build || c.builds[0];
  const byType = {};
  for (const x of b.capsules) byType[x.type] = (byType[x.type] || 0) + x.cost;
  const order = Object.entries(byType).sort((x, y) => y[1] - x[1]).map(([t]) => t);
  // Grouped by type, biggest share first, so the list reads in the same order as the bar.
  const caps = [...b.capsules].sort((x, y) => order.indexOf(x.type) - order.indexOf(y.type) || y.cost - x.cost || x.name.localeCompare(y.name));
  return `<div class="block">
    <div class="top"><span class="k">${view.build ? 'Capsules' : 'Most common build'}</span><span class="x">${b.cost} cost</span></div>
    ${view.build ? '' : `<span class="bpill" style="--c:${buildColor(b.label)}">${esc(b.label)}</span> <span class="x">${b.matches} of ${c.matches} matches</span>`}
    <div class="costbar">${order.map(t => `<span style="--c:${CAP_COLOR[t] || 'var(--utility)'};flex:${byType[t]}" title="${t} ${byType[t]}"></span>`).join('')}</div>
    <ul class="caplist">${caps.map(x => `<li style="--c:${CAP_COLOR[x.type] || 'var(--utility)'}"><span class="sw"></span><span>${esc(x.name)}</span><span class="cost">${x.cost}</span></li>`).join('')}</ul>
  </div>`;
}
function aiBlock(v) {
  const a = v.ai;
  const val = a.tied ? `Varied <span class="x">${a.strategies} strategies</span>`
    : `${esc(a.name)} <span class="x">${Math.round(a.share * 100)}% of matches</span>`;
  return `<div class="ai"><div class="k">${view.build ? 'AI' : 'Most used AI'}</div><div class="v">${val}</div></div>`;
}

// A raw zero is "never", not a rank. Ranks are mid-rank on ties, so the ~1 in 5
// characters who never use a skill all sit at "Bottom 9%" - and a bar drawn at 9%
// looks like real use. Zero gets an empty bar and "Never" instead.
function styleShown(v, st) {
  const raw = st.rate ? v.rate[st.rate] : null;
  if (raw === 0) return { p: 0, text: 'Never', zero: true };
  const p = v.pct['style_' + st.key];
  return { p, text: rankText(v, 'style_' + st.key), zero: false };
}
function mini(p, color, zero = false) { color = styleFill(color, p, zero); return `<span class="mini" style="--c:${color}">${zero ? '' : `<span class="fill" style="width:${Math.max(3, p)}%"></span>`}<span class="med"></span></span>`; }
// The sub-stats under a style: [label, metric key, this character's value, raw, is-outcome, league median].
function subParts(v, key) {
  const pm = (x, dp) => `${nf(x, dp)}/min`, M = DATA.medians;
  if (key === 'melee') return [
    ['Rush', 'r_rush', pm(v.rate.rush, 1), v.rate.rush, false, pm(M.r_rush, 1)],
    ['Heavy', 'r_heavy', pm(v.rate.heavy, 1), v.rate.heavy, false, pm(M.r_heavy, 1)],
  ];
  if (key === 'blast') return [
    ['Super 1', 'r_s1', pm(v.rate.s1, 2), v.rate.s1, false, pm(M.r_s1, 2)],
    ['Super 2', 'r_s2', pm(v.rate.s2, 2), v.rate.s2, false, pm(M.r_s2, 2)],
  ];
  if (key === 'skill') return [
    ['Skill 1', 'r_sk1', pm(v.rate.sk1, 2), v.rate.sk1, false, pm(M.r_sk1, 2)],
    ['Skill 2', 'r_sk2', pm(v.rate.sk2, 2), v.rate.sk2, false, pm(M.r_sk2, 2)],
  ];
  if (key === 'defense') return [
    ['Guards', 'r_guard', pm(v.rate.guard, 1), v.rate.guard, false, pm(M.r_guard, 1)],
    ['Counters', 'r_counter', pm(v.rate.counter, 1), v.rate.counter, false, pm(M.r_counter, 1)],
    ['Tags', 'tags', `${nf(v.tagsPerMatch, 1)}/match`, v.tagsPerMatch, true, `${nf(M.tags, 1)}/match`],
    ['Survival', 'survival', `${Math.round(v.survival * 100)}%`, v.survival, true, `${Math.round(M.survival * 100)}%`],
  ];
  return [];
}
const shownVal = ([, , val, raw, outcome]) => raw === 0 && !outcome ? 'Never' : val;
function subRow(v, key, color) {
  const parts = subParts(v, key);
  if (!parts.length) return '';
  return `<div class="sub">${parts.map(part => {
    const [n, k, , raw] = part;
    const unit = k === 'tags' ? 'Per match' : k === 'survival' ? 'Survived' : 'Per min';
    const tip = tipTable(n, [[unit, shownVal(part), part[5]]], raw === 0 && !part[4] ? '' : `Rank <b>${rankFull(v, k)}</b>`);
    return `<span class="part" data-tip="${tip}" tabindex="0">${n} ${mini(v.pct[k], color, raw === 0)} <b>${shownVal(part)}</b></span>`;
  }).join('')}</div>`;
}
// Everything the bars show for one style, for the radar's tooltip.
function styleTip(v, st) {
  const sh = styleShown(v, st);
  const rows = st.rate ? [['Per min', sh.zero ? 'Never' : nf(v.rate[st.rate], st.dp), nf(DATA.medians['r_' + st.rate], st.dp)]] : [];
  for (const part of subParts(v, st.key)) rows.push([part[0], shownVal(part), part[5]]);
  return tipTable(st.name, rows, sh.zero ? '' : `Rank <b>${rankFull(v, 'style_' + st.key)}</b>`);
}
function barsHTML(v) {
  const atName = state.rankPos === 'name';
  const head = `<div class="barshead"><span></span><span></span><span>Per min</span><span>League</span>${atName ? '' : '<span>Rank</span>'}</div>`;
  return `<div class="bars${atName ? ' rk-name' : ''}">${head}${STYLES.map(st => {
    const { p, text, zero } = styleShown(v, st);
    const val = st.rate ? nf(v.rate[st.rate], st.dp) : '';
    const lg = st.rate ? nf(DATA.medians['r_' + st.rate], st.dp) : '';
    const mark = rankChip(p, text, zero);
    const fill = styleFill(st.color, p, zero);
    return `<div class="bar" style="--c:${st.color}"><div class="ax"><span class="sw"></span>${st.name}${atName ? `<span class="axr">${mark}</span>` : ''}</div>
      <div class="ptrack">${zero ? '' : `<div class="fill" style="width:${Math.max(2, p)}%;background:${fill}${state.barColor === 'neutral' ? ';opacity:.55' : ''}"></div>`}<div class="med"></div></div>
      <div class="num">${val}</div><div class="lg">${lg}</div>${atName ? '' : `<div class="rk">${mark}</div>`}${subRow(v, st.key, st.color)}</div>`;
  }).join('')}</div>`;
}
function radarHTML(v, s) {
  const R = 125, W = 440, cx = W / 2, cy = R + 44, H = cy + R + 60, N = STYLES.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + i * 2 * Math.PI / N; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const poly = f => STYLES.map((_, i) => pt(i, f(i)).map(n => n.toFixed(1)).join(',')).join(' ');
  const rings = [0.25, 0.75, 1].map(f => `<polygon points="${poly(() => R * f)}" fill="${f === 1 ? 'var(--panel2)' : 'none'}" stroke="var(--line2)"/>`).join('');
  const spokes = STYLES.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line2)"/>`; }).join('');
  // League median: the 50th-percentile hexagon, dashed and lightly filled so it reads as a zone.
  const league = `<polygon points="${poly(() => R * 0.5)}" fill="var(--muted)" fill-opacity=".08" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="5 4"/>`;
  // A style never used sits at the centre, not at its tied rank.
  const vals = STYLES.map(st => { const { p, zero } = styleShown(v, st); return zero ? 0 : Math.max(5, p) / 100 * R; });
  const shape = `<polygon points="${poly(i => vals[i])}" fill="${s.color}" fill-opacity=".22" stroke="${s.color}" stroke-width="2.4" stroke-linejoin="round"/>`;
  const dots = STYLES.map((st, i) => { const [x, y] = pt(i, vals[i]), sh = styleShown(v, st); return `<circle cx="${x}" cy="${y}" r="5" fill="${styleFill(st.color, sh.p, sh.zero)}" stroke="var(--panel)" stroke-width="1.5"/>`; }).join('');
  // Hover targets bigger than the dots, carrying the actual numbers.
  const hits = STYLES.map((st, i) => { const [x, y] = pt(i, vals[i]); return `<circle class="hit" cx="${x}" cy="${y}" r="14" fill="transparent" data-tip="${styleTip(v, st)}"/>`; }).join('');
  // Names and rank chips are HTML laid over the chart, so the chips can be real chips and
  // the names can take hover and keyboard focus too.
  const labels = STYLES.map((st, i) => {
    const [x, y] = pt(i, R + 20), sh = styleShown(v, st);
    const side = Math.abs(x - cx) < 5 ? 'middle' : x > cx ? 'start' : 'end';
    const tx = side === 'middle' ? '-50%' : side === 'start' ? '0' : '-100%';
    const ty = y < cy - 20 ? '-55%' : y > cy + 20 ? '-5%' : '-50%';
    const align = side === 'middle' ? 'center' : side === 'start' ? 'left' : 'right';
    return `<div class="rlabel" tabindex="0" data-tip="${styleTip(v, st)}" style="--c:var(--text);left:${(x / W * 100).toFixed(2)}%;top:${(y / H * 100).toFixed(2)}%;transform:translate(${tx},${ty});text-align:${align}">
      <div class="rname"><span class="sw" style="--c:${st.color}"></span>${st.name}</div>${rankChip(sh.p, sh.text, sh.zero)}</div>`;
  }).join('');
  return `<div class="radarbox"><svg class="radar" viewBox="0 0 ${W} ${H}" role="img" aria-label="Fighting style radar">${rings}${league}${spokes}${shape}${dots}${hits}</svg>${labels}</div>`;
}

let state = { char: 0, theme: 'dark', viz: 'radar', barColor: 'style', marker: 'text', rankPos: 'col', build: null, menu: false };
try { const saved = JSON.parse(localStorage.getItem('ovdemo11') || '{}'); state = { ...state, char: saved.char ?? 0, theme: saved.theme ?? 'dark', viz: saved.viz ?? 'radar', build: null, menu: false }; } catch {}

function seg(el, items, cur, onPick) {

  el.onclick = e => { const b = e.target.closest('button'); if (b) onPick(b.dataset.v); };
}

function render() {
  try { localStorage.setItem('ovdemo11', JSON.stringify({ char: state.char, theme: state.theme, viz: state.viz })); } catch {}
  document.documentElement.dataset.theme = state.theme;
  const c = DATA.characters[state.char] || DATA.characters[0];
  view = { build: state.build === null ? null : c.builds[state.build] };
  const v = view.build || c;
  const s = styleOf(v);

  seg(document.getElementById('chars'), DATA.characters.map((x, i) => [String(i), x.name]), String(state.char), val => { state.char = +val; state.build = null; state.menu = false; render(); });
  seg(document.getElementById('theme'), [['dark', 'Dark'], ['light', 'Light']], state.theme, val => { state.theme = val; render(); });
  document.getElementById('ident').innerHTML = identHTML(c, v);
  document.getElementById('banner').innerHTML = bannerHTML();

  document.getElementById('page').innerHTML = `
    ${tiles(v)}${moves(v)}
    <div class="style">
      <div>
        <div class="buildpick" id="buildpick">${pickerHTML(c)}</div>
        <div class="label-card" style="--c:${s.color}">
          <div class="k">Fighting style</div>
          <h2>${s.html}</h2>
          ${buildBlock(c)}
          ${aiBlock(v)}
        </div>
      </div>
      <div>
        <div class="stylehead"><div class="h">How it fights</div>
          <div class="headright">
            <span class="legend">${state.viz === 'radar' ? '<span class="dash"></span>' : '<i></i>'}league median</span>
            <div class="toggle" role="group" aria-label="Chart type">
              <button data-viz="radar" aria-pressed="${state.viz === 'radar'}">Radar</button><button data-viz="bars" aria-pressed="${state.viz === 'bars'}">Bars</button>
            </div>
          </div></div>
        ${state.viz === 'radar' ? radarHTML(v, s) : barsHTML(v)}
      </div>
    </div>`;

  // Clicks inside the picker must not reach the document's close-on-outside-click
  // listener: re-rendering detaches the clicked element, so it would look "outside".
  const pick = document.getElementById('buildpick');
  pick.onclick = e => e.stopPropagation();
  pick.querySelector('#picker').onclick = () => { state.menu = !state.menu; render(); };
  pick.querySelectorAll('.opt').forEach(o => o.onclick = () => { const i = +o.dataset.i; state.build = i < 0 ? null : i; state.menu = false; render(); });
  document.querySelectorAll('[data-clear]').forEach(b => b.onclick = () => { state.build = null; render(); });
  document.querySelectorAll('[data-viz]').forEach(b => b.onclick = () => { state.viz = b.dataset.viz; render(); });

  const bs = DATA.basis, w = DATA.defWeights;
  document.getElementById('note').innerHTML = `<summary>Demo notes (not part of the design)</summary>
    <ul>
      <li>Real data: seasons ${bs.seasons.join(' + ')}, ${bs.difficulty} only, ${nf(bs.matches)} matches (the tier-cutoff basis). Ranks vs the ${bs.characters} characters with ${bs.poolMin}+ appearances.</li>
      <li>Scores and tiers come from the app's own aggregation and the leaderboard's own build filter. A build = exact capsules + AI strategy.</li>
      <li>Per-match figures are per match the character fought in. Supers / Ultimate: hit/thrown; Ki blasts: fired per match (a hit rate is not recoverable - deflected blasts count as the deflector's hits); the tick is the league median hit rate. Skills: uses per match; the dashed circle is the league median.</li>
      <li>Defense = guards ${w.r_guard * 100}%, counters ${w.r_counter * 100}%, time on field ${w.avgTime * 100}%, tags ${w.tags * 100}%, survival ${w.survival * 100}%.</li>
    </ul>`;
}
document.addEventListener('click', () => { if (state.menu) { state.menu = false; render(); } });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && state.menu) { state.menu = false; render(); } });

// Tooltips: hover, keyboard focus, or a tap (which browsers deliver as a mouseover).
const tipEl = document.getElementById('tip');
function showTip(el) {
  tipEl.innerHTML = decodeURIComponent(el.getAttribute('data-tip'));
  tipEl.hidden = false;
  const r = el.getBoundingClientRect(), t = tipEl.getBoundingClientRect();
  let x = r.left + r.width / 2 - t.width / 2, y = r.top - t.height - 8;
  if (y < 8) y = r.bottom + 8;
  x = Math.max(8, Math.min(innerWidth - t.width - 8, x));
  tipEl.style.left = x + 'px';
  tipEl.style.top = y + 'px';
}
document.addEventListener('mouseover', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); else tipEl.hidden = true; });
document.addEventListener('focusin', e => { const el = e.target.closest && e.target.closest('[data-tip]'); if (el) showTip(el); });
document.addEventListener('focusout', () => { tipEl.hidden = true; });
addEventListener('scroll', () => { tipEl.hidden = true; }, { passive: true });
render();
</script>
</body>
</html>
